# The campaign tier's standing automated home (Task 19.27;
# audits/audit-phase-19-triage.md §7 item 19, the tiering half). `uv run
# pytest` everywhere else runs the default tier — pyproject's
# `addopts = -m "not campaign"` keeps the frozen campaign-only families
# (training/README.md §2 FREEZE column) out of every per-change gate — so this
# weekly scheduled job is what keeps `-m campaign` from becoming an orphan
# anyone has to remember to run. The phase close (Task 19.28) runs both tiers
# explicitly on top of this.
#
# A SEPARATE workflow file, not a job in ci.yml (Codex review on PR #349): a
# schedule/dispatch trigger shared with ci.yml would emit SKIPPED instances of
# the per-change jobs on every firing, and GitHub treats a skipped job as
# satisfying a required branch-protection check of the same name — a campaign
# dispatch on a PR head could then "pass" Project checks without running them.
# Its own file means the per-change jobs never materialize on these triggers.
#
# The tier runs weekly rather than behind a training/** path filter because it
# must also catch rot introduced from OUTSIDE training/ — an engine or schema
# change that breaks a frozen family — which no path filter can see. Schedules
# fire on the default branch only, which is exactly the branch the frozen
# families guard; workflow_dispatch gives operators an on-demand run (e.g.
# pre-close or post-incident).
name: Campaign tier

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

# Least privilege, as in ci.yml: the job only reads the repository.
permissions:
  contents: read

jobs:
  campaign-tier:
    name: Campaign-tier tests (weekly)
    runs-on: ubuntu-latest

    env:
      # Python-only job: the frontend legs have their own per-change jobs in
      # ci.yml and nothing in the campaign families touches them.
      AILIBI_SKIP_FRONTEND: "1"

    steps:
      # Actions are pinned to full commit SHAs (the tag they resolved from is
      # in the trailing comment), matching ci.yml's convention.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up project environment
        run: bash scripts/setup_env.sh

      # The CLI -m overrides pyproject's default `-m "not campaign"` (last -m
      # wins), so this is the whole opt-in surface: one flag.
      - name: Run the campaign tier
        run: uv run pytest -m campaign
