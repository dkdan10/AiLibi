name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege for the whole workflow: every job here only reads the
# repository. Nothing publishes, comments, or writes back, so no job needs a
# broader token than `contents: read`.
permissions:
  contents: read

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest

    env:
      # The frontend-checks job below is the ONE frontend build per run. Without
      # this opt-out, setup_env.sh would `npm ci` and check.sh would run
      # `tsc:check && build` here too, building the same thing twice per CI run.
      # Locally the variable is unset, so `bash scripts/check.sh` keeps its
      # frontend leg and stays the one-command truth.
      AILIBI_SKIP_FRONTEND: "1"

    steps:
      # Actions are pinned to full commit SHAs (the tag they resolved from is in
      # the trailing comment). A mutable tag like `@v6` is a live pointer into
      # someone else's repository; the SHA is not. Re-resolve the tag and update
      # both the SHA and the comment together when bumping.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up project environment
        run: bash scripts/setup_env.sh

      - name: Run checks
        run: bash scripts/check.sh

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheapest signal first (same order as scripts/check.sh's frontend leg), so
      # a lint or unit failure reports in seconds instead of after a full bundle.
      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run tsc:check

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  # The THIRD leg (Task 19.12): one browser journey over the real app and the
  # real API. Its own job because it is the only one needing BOTH toolchains —
  # uv for the FastAPI backend and Node for the Vite dev server, both started by
  # Playwright's `webServer` config — and because keeping it separate means a
  # browser problem never masquerades as a build problem.
  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The backend the journey drives. AILIBI_SKIP_FRONTEND=1 because this job
      # installs the frontend itself, below.
      - name: Install Python dependencies
        run: bash scripts/setup_env.sh
        env:
          AILIBI_SKIP_FRONTEND: "1"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The browser is PINNED, so cache it by that pin. `@playwright/test` is held
      # at an exact version in package.json (no caret) precisely because the
      # Playwright version IS the Chromium build; keying the cache on the resolved
      # version means a bump re-downloads exactly once and every other run reuses
      # the cached browser instead of pulling ~150 MB per job.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On a cache HIT this only ensures the OS libraries (apt, seconds); the
      # browser download itself is skipped because the binary is already there.
      - name: Install Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the spectator journey
        run: npm run e2e
        working-directory: frontend

      # Only on failure, and only the report: a green run uploads nothing. The
      # trace is `retain-on-failure`, so this is the timeline of what broke.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore
