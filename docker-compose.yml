services:
  api:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
      UV_PROJECT_ENVIRONMENT: /tmp/ailibi-venv
    ports:
      - "${AILIBI_API_PORT:-8000}:8000"
