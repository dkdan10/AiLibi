[project]
name = "ailibi"
version = "0.1.0"
description = "Multi-agent social-deduction simulation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.136.1",
    "hypothesis==6.152.4",
    "import-linter==2.11",
    "mypy==1.20.2",
    "pydantic==2.13.3",
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
