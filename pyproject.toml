[project]
name = "ailibi"
version = "0.1.0"
description = "Multi-agent social-deduction simulation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime dependencies only: what the production packages (api, orchestrator,
# meetings, agents, llm, engine, observation) need to import and run. The gate
# toolchain lives in the `dev` dependency group below. The partition is provable,
# not decorative:
#
#     uv run --no-dev --exact python -c "import api.main, orchestrator.game, \
#         meetings.manager, agents.strategic.prompts.loader, llm.provider, engine.tick"
#
# (`--no-dev --exact` is load-bearing — a bare `uv run` re-syncs the dev group and
# the probe passes vacuously; the entry-module list is load-bearing too, because
# all six package `__init__.py` files are 0 bytes and importing the bare packages
# executes none of the production graph.)
#
# Known, accepted boundary: `training/` and `eval/` are NOT covered by that claim.
# `eval/leak_test.py:9` imports pytest at module level and both production-side
# consumers (`training/bakeoff/harness.py:107`, `training/crew/scorer.py:113`)
# import from it, so training/eval remain dev-environment surfaces until Task
# 19.24 promotes the scanners to a pytest-free library.
dependencies = [
    "anthropic==0.104.1",
    "fastapi==0.136.1",
    # Direct dependency of llm/featherless_client.py (the canonical eval
    # provider's HTTP transport). The import there is lazy, but the declaration
    # is not optional: without this line the client rides in transitively via
    # anthropic/ollama and would break the moment either drops or repins it.
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "ollama==0.6.2",
    "pydantic==2.13.3",
    "pyyaml==6.0.3",
    "uvicorn==0.38.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "scripts"
# Throwaway ML-feasibility-spike scripts (experiments/lab/ml_spike/) are explicitly
# exploratory (see experiments/lab/ml-spike-charter.md) and use a sys.path bootstrap
# mypy can't follow; exclude them from the strict gate. The grounding probes
# (experiments/lab/visibility_*.py + inference_*.py) reuse ml_spike.core via the same
# bootstrap, and stopwatch_*.py monkeypatches engine internals through the same sys.path
# bootstrap, so they are excluded on the same grounds; forward_redesign_probes.py is a
# one-off $0 desk probe over committed replays, excluded likewise. The torch probe
# (experiments/lab/torch_probe/, Task 15.17) is experiment-tier code run via
# `uv run --with torch` — torch is never installed for this gate — excluded on the
# ml_spike grounds (same sys.path bootstrap, too). The maintained top-level
# lab tools (experiments/lab/*.py) stay type-checked. design/ holds one-off design-artifact
# generators (e.g. phase-12/gen_map_reference.py), not production code — excluded too.
# The last three alternatives are the class-(c) evidence destinations
# scripts/fetch_evidence.sh restores into. Their restored bytes are untracked by design —
# operator-machine slate helpers never held to this bar — and a .gitignore fences
# `git add`, not a type checker, so without these the documented restore and the
# documented gate exclude each other. Neither destination holds a tracked .py, so the
# strict bar loses nothing; tests/scripts/test_verify_ml_evidence.py pins both halves
# against the script's own destination assignments.
exclude = "^(experiments/lab/ml_spike/|experiments/lab/torch_probe/|experiments/lab/(visibility|inference|stopwatch|forward_redesign)_|design/|training/artifacts/coevo/|training/reports/_finalist_eval_raw/|replays/records/phase-21-wave2-finding/)"

[tool.pytest.ini_options]
pythonpath = ["."]
# Task 19.27 (audits/audit-phase-19-triage.md §7 items 19 + 28): the suite is
# two tiers. A bare `uv run pytest` (and therefore scripts/check.sh) runs the
# DEFAULT tier — everything not marked `campaign`. The campaign tier is opt-in
# via `-m campaign` (a CLI -m overrides this addopts -m; last one wins) and has
# a standing automated home in .github/workflows/campaign-tier.yml's weekly
# schedule, so it is exercised by automation, not by promise. The always-on set the
# tier map keeps un-marked (training/README.md §2) is pinned by
# tests/training/test_suite_tiers.py. --strict-markers makes a typo'd marker a
# collection error instead of a silently always-on test.
#
# No `-n` here on purpose: scripts/check.sh passes the pytest-xdist flags, so a
# bare `uv run pytest <node-id>` stays single-process and debuggable (`-s`, pdb
# and a readable traceback all work). tests/scripts/test_gate_invocation.py pins
# both halves.
addopts = "--strict-markers -m 'not campaign'"
markers = [
    "campaign: campaign-tier tests over the frozen ML campaign machinery (training/README.md §2 FREEZE column). Excluded from the default gate; run weekly by CI's campaign-tier job, on demand with `uv run pytest -m campaign`, and at phase close. NOTE: the default -m filter also applies to explicit node ids — running a marked file directly needs `-m campaign` too.",
    "slow: registered for tiering annotation (Task 19.27); carries no default filter — a slow test still runs in the default gate. Reserved so a future cut can select on it without re-registering.",
    "perf: registered for tiering annotation (Task 19.27); carries no default filter. Reserved for performance-measurement tests a future cut may separate.",
]

[dependency-groups]
# The gate toolchain: everything `scripts/check.sh` runs and nothing the
# production packages import. `uv sync` / `uv run` include the `dev` group by
# default; `scripts/setup_env.sh` and CI still name it explicitly so the
# dependency the gates rely on is stated rather than inherited.
dev = [
    "hypothesis==6.152.4",
    "import-linter==2.11",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
    "types-pyyaml==6.0.12.20260408",
]
