[project]
name = "ailibi"
version = "0.1.0"
description = "Multi-agent social-deduction simulation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==0.104.1",
    "fastapi==0.136.1",
    "hypothesis==6.152.4",
    "import-linter==2.11",
    "jinja2==3.1.6",
    "mypy==1.20.2",
    "ollama==0.6.2",
    "pydantic==2.13.3",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "ruff==0.15.12",
    "uvicorn==0.38.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "scripts"
# Throwaway ML-feasibility-spike scripts (experiments/lab/ml_spike/) are explicitly
# exploratory (see experiments/lab/ml-spike-charter.md) and use a sys.path bootstrap
# mypy can't follow; exclude them from the strict gate. The maintained top-level lab
# tools (experiments/lab/*.py) stay type-checked. design/ holds one-off design-artifact
# generators (e.g. phase-12/gen_map_reference.py), not production code — excluded too.
exclude = "^(experiments/lab/ml_spike/|design/)"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "types-pyyaml==6.0.12.20260408",
]
